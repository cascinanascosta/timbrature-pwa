services:
  - type: web
    name: cascina
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cascina-db
          property: connectionString
      - key: ADMIN_PIN
        sync: false
      - key: TZ
        value: Europe/Rome

databases:
  - name: cascina-db
    databaseName: cascina
    user: cascina
