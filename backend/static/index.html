<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cascina Nascosta · Timbrature</title>
<style>
:root{
  --cream:#f7f3dc;
  --green:#65ad3f;
  --green2:#3e8f3c;
  --purple:#5d184f;
  --orange:#ef5a24;
  --yellow:#f6c914;
  --ink:#351331;
  --pink:#f7a49a;
  --white:#fffdf4;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--cream);color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;overflow-x:hidden;
}
header{
  height:84px;background:#fff;border-bottom:2px solid #ddd8c6;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 4vw;position:relative;z-index:5;
}
.logo{font-weight:900;line-height:.78;font-size:30px;letter-spacing:-2px;color:#65756c}
nav{display:flex;gap:28px;font-weight:800;font-size:14px}
nav span{cursor:pointer}
.badge{background:var(--green);color:white;padding:10px 18px;border-radius:3px}
.hero{
  min-height:calc(100vh - 84px);position:relative;overflow:hidden;
  display:flex;align-items:center;padding:60px 7vw;
}
.hero-copy{width:44%;position:relative;z-index:3}
.kicker{
  display:inline-block;background:var(--yellow);border:4px solid var(--purple);
  padding:8px 18px;font-weight:900;transform:rotate(-2deg);font-size:16px;
}
h1{
  font-size:clamp(48px,6vw,86px);line-height:.9;margin:22px 0 16px;
  letter-spacing:-5px;text-transform:uppercase;
}
h1 em{font-style:normal;color:var(--green)}
.subtitle{font-size:19px;line-height:1.45;max-width:510px;font-weight:600}
.card{
  margin-top:30px;background:var(--white);border:5px solid var(--purple);
  box-shadow:10px 10px 0 var(--purple);padding:24px;max-width:430px;
}
.card h2{margin:0 0 16px;font-size:24px}
input,select{
  width:100%;padding:14px;border:3px solid var(--purple);
  background:#fff;font-size:16px;margin-bottom:12px;border-radius:0;
}
button{
  border:4px solid var(--purple);background:var(--orange);color:white;
  padding:14px 22px;font-weight:900;font-size:16px;cursor:pointer;
  box-shadow:5px 5px 0 var(--purple);width:100%;
}
button:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--purple)}
.status{margin-top:14px;font-weight:800;min-height:24px}
.illustration{
  position:absolute;right:-4vw;top:7%;width:60%;height:88%;
  border-left:0 solid transparent;
}
.ground{position:absolute;bottom:-12%;left:0;width:110%;height:55%;
  background:var(--green);border-radius:48% 48% 0 0;border-top:8px solid var(--purple);
}
.path{
  position:absolute;bottom:-5%;left:14%;width:42%;height:85%;
  background:#f69b88;border:7px solid var(--purple);
  transform:rotate(15deg);border-radius:50%;
}
.house{
  position:absolute;right:14%;bottom:34%;width:52%;height:34%;
  background:var(--yellow);border:7px solid var(--purple);
}
.roof{
  position:absolute;right:10%;bottom:63%;width:60%;height:28%;
  background:var(--orange);border:7px solid var(--purple);
  transform:skewX(-18deg);
}
.window{
  position:absolute;width:52px;height:70px;background:#fff;border:6px solid var(--purple);
  box-shadow:inset 22px 0 0 transparent;
}
.w1{right:33%;bottom:43%}.w2{right:18%;bottom:43%}
.tree{position:absolute;z-index:2}
.trunk{width:28px;height:160px;background:var(--purple);margin:auto}
.crown{width:150px;height:150px;background:var(--green2);border:7px solid var(--purple);border-radius:50%}
.t1{left:9%;bottom:30%}.t2{right:1%;bottom:43%;transform:scale(.8)}
.flower{
  position:absolute;width:28px;height:28px;background:var(--pink);
  border:5px solid var(--purple);border-radius:50%;
}
.f1{right:35%;bottom:23%}.f2{right:9%;bottom:29%}
.sign{
  position:absolute;right:28%;bottom:48%;z-index:4;
  background:var(--pink);border:6px solid var(--purple);
  padding:15px 28px;font-weight:900;font-size:20px;transform:rotate(-2deg);
}
.bike{
  position:absolute;right:3%;bottom:12%;font-size:85px;transform:rotate(-8deg);z-index:3;
}
.balloons{position:absolute;right:42%;top:17%;font-size:48px;transform:rotate(-10deg)}
@media(max-width:900px){
  nav{display:none}.hero{padding:35px 6vw;align-items:flex-start}
  .hero-copy{width:100%}.illustration{opacity:.25;width:100%;right:-20%;top:25%}
  .card{max-width:100%}
}
</style>
</head>
<body>
<header>
  <div class="logo">CASCINA<br>NAScostA</div>
  <nav>
    <span>CHI SIAMO</span><span>IL MENU</span><span>ATTIVITÀ & SPAZI</span>
    <span>CALENDARIO</span><span>ORARI & CONTATTI</span>
  </nav>
  <div class="badge">TIMBRATURE</div>
</header>

<main class="hero">
  <section class="hero-copy">
    <div class="kicker">AREA STAFF · CASCINA NASCOSTA</div>
    <h1>Timbrature<br><em>Cascina</em></h1>
    <p class="subtitle">
      Il tuo ingresso e la tua uscita, semplici e veloci.
      Inserisci il tuo codice personale per registrare la timbratura.
    </p>

    <div class="card">
      <h2>Registra timbratura</h2>
      <input id="code" type="text" inputmode="numeric" autocomplete="off"
             placeholder="Codice dipendente">
      <button onclick="timbratura()">TIMBRA ORA</button>
      <div class="status" id="status"></div>
    </div>
  </section>

  <div class="illustration" aria-hidden="true">
    <div class="ground"></div>
    <div class="path"></div>
    <div class="house"></div>
    <div class="roof"></div>
    <div class="window w1"></div><div class="window w2"></div>
    <div class="sign">CASCINA<br>NASCOSTA</div>
    <div class="balloons">○ ○</div>
    <div class="tree t1"><div class="crown"></div><div class="trunk"></div></div>
    <div class="tree t2"><div class="crown"></div><div class="trunk"></div></div>
    <div class="flower f1"></div><div class="flower f2"></div>
    <div class="bike">🚲</div>
  </div>
</main>

<script>
async function timbratura(){
  const code=document.getElementById('code').value.trim();
  const status=document.getElementById('status');
  if(!code){status.textContent='Inserisci il codice personale.';return;}
  status.textContent='Registrazione in corso…';
  try{
    const r=await fetch('/api/timbra',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({codice:code})
    });
    const data=await r.json().catch(()=>({}));
    if(r.ok) status.textContent=data.message || 'Timbratura registrata ✓';
    else status.textContent=data.detail || 'Impossibile registrare la timbratura.';
  }catch(e){
    status.textContent='Server non raggiungibile.';
  }
}
document.getElementById('code').addEventListener('keydown',e=>{
  if(e.key==='Enter') timbratura();
});
</script>
</body>
</html>
