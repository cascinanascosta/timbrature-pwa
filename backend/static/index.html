<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cascina Nascosta</title><style>:root{--cream:#f7f3dc;--purple:#55103f;--green:#62ad3e;--yellow:#f4c500;--orange:#ef5a19;--pink:#f59d98}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--purple);font-family:Arial,sans-serif}.hero{height:43vh;min-height:260px;background:url('/static/cascina.png') center 35%/cover no-repeat;border-bottom:7px solid var(--purple)}.wrap{max-width:760px;margin:auto;padding:24px 18px 45px;text-align:center}.logo{font-weight:900;font-size:34px;line-height:.85;letter-spacing:-2px}.sub{font-size:18px;margin:8px 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}a{padding:17px;border:4px solid var(--purple);border-radius:16px;text-decoration:none;color:var(--purple);background:white;font-weight:900;box-shadow:5px 5px 0 var(--purple)}a:nth-child(1){background:var(--yellow)}a:nth-child(2){background:var(--green)}a:nth-child(3){background:var(--pink)}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero{height:34vh}}</style></head><body><div class="hero"></div><main class="wrap"><div class="logo">CASCINA NASCOSTA</div><div class="sub">Sistema timbrature</div><div class="grid"><a href="/employee">AREA DIPENDENTE</a><a href="/qr">QR TIMBRATURA</a><a href="/admin">BACK OFFICE</a></div></main></body></html>
