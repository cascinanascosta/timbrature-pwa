<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Back office</title><style>body{font-family:Arial;background:#f5f3ee;margin:0}.box{max-width:850px;margin:25px auto;padding:25px;background:#fff;border-radius:20px}input,select,button{padding:11px;margin:5px;border-radius:8px;border:1px solid #ccc}button{background:#222;color:#fff}.grid{display:flex;flex-wrap:wrap;gap:8px}</style></head><body><div class="box"><h1>Back office</h1><h3>Dipendenti</h3><div id="emps"></div><hr><h3>Nuovo dipendente</h3><div class="grid"><input id="n" placeholder="Nome"><input id="p" placeholder="PIN"><select id="t"><option>Sala</option><option>Cucina</option></select><button onclick="add()">Aggiungi</button></div><hr><h3>Esporta mese</h3><input id="y" type="number"><input id="m" type="number" min="1" max="12"><select id="f"><option value="">Tutti</option><option value="Sala">Sala</option><option value="Cucina">Cucina</option></select><select id="e"><option value="">Tutti i dipendenti</option></select><button onclick="exporter()">Esporta CSV</button></div><script>y.value=new Date().getFullYear();m.value=new Date().getMonth()+1;async function load(){let a=await (await fetch('/api/employees')).json();emps.innerHTML=a.map(x=>'<div>'+x.name+' — '+x.team+'</div>').join('');e.innerHTML='<option value="">Tutti i dipendenti</option>'+a.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('')}async function add(){await fetch('/api/employees',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.value,pin:p.value,team:t.value})});load()}function exporter(){let u='/api/report?year='+y.value+'&month='+m.value;if(f.value)u+='&team='+f.value;if(e.value)u+='&employee_id='+e.value;location.href=u}load()</script></body></html>
