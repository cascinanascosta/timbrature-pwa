<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Back Office</title><style>:root{--cream:#f7f3dc;--purple:#55103f;--green:#62ad3e;--yellow:#f4c500;--pink:#f59d98;--orange:#ef5a19}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--purple);font-family:Arial}.wrap{max-width:1050px;margin:auto;padding:22px}.title{font-size:34px;font-weight:900}.card{background:white;border:4px solid var(--purple);border-radius:20px;padding:20px;margin:15px 0;box-shadow:6px 6px 0 var(--purple)}input,select,button{padding:11px;border:3px solid var(--purple);border-radius:10px;font-size:15px}button{background:var(--yellow);font-weight:900;cursor:pointer}.row{display:grid;grid-template-columns:1.4fr .8fr .8fr .8fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:2px solid #eadfca}.form{display:grid;grid-template-columns:1.2fr .8fr .8fr auto;gap:8px}.muted{opacity:.55}.filters{display:flex;gap:8px;flex-wrap:wrap}.export{background:var(--green)}@media(max-width:700px){.row{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.row button{width:100%}}</style></head><body><main class="wrap"><div class="title">CASCINA NASCOSTA · BACK OFFICE</div><div class="card"><h2>Gestione dipendenti</h2><div class="form"><input id="n" placeholder="Nome"><input id="p" placeholder="PIN"><select id="t"><option>Sala</option><option>Cucina</option></select><button onclick="add()">+ AGGIUNGI</button></div><div id="emps" style="margin-top:18px"></div></div><div class="card"><h2>Esportazione mensile</h2><div class="filters"><input id="y" type="number"><input id="m" type="number" min="1" max="12"><select id="f"><option value="">Tutti i team</option><option>Sala</option><option>Cucina</option></select><select id="e"><option value="">Tutti i dipendenti</option></select><button class="export" onclick="exporter()">ESPORTA CSV</button></div><p>Formato: date nelle righe; ogni dipendente occupa tre colonne <b>E · U · T</b>. Un turno spezzato viene riportato su due righe.</p></div></main><script>y.value=new Date().getFullYear();m.value=new Date().getMonth()+1;let data=[];async function load(){data=await (await fetch('/api/employees')).json();emps.innerHTML=data.map(x=>`<div class="row ${x.active?'':'muted'}"><b>${x.name}</b><select onchange="edit(${x.id},this.value,null,null)"><option ${x.team==='Sala'?'selected':''}>Sala</option><option ${x.team==='Cucina'?'selected':''}>Cucina</option></select><input id="pin${x.id}" value="${x.pin}" placeholder="PIN"><button onclick="save(${x.id})">SALVA</button><button onclick="toggle(${x.id},${!x.active})">${x.active?'DISATTIVA':'RIATTIVA'}</button></div>`).join('');e.innerHTML='<option value="">Tutti i dipendenti</option>'+data.filter(x=>x.active).map(x=>`<option value="${x.id}">${x.name} · ${x.team}</option>`).join('')}async function add(){if(!n.value||!p.value)return alert('Inserisci nome e PIN');let r=await fetch('/api/employees',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.value,pin:p.value,team:t.value})});if(!r.ok)return alert((await r.json()).detail||'Errore');n.value='';p.value='';load()}async function save(id){let x=data.find(a=>a.id===id);let row=[...document.querySelectorAll('.row')].find(z=>z.innerText.includes(x.name));let selects=row.querySelectorAll('select');let team=selects[0].value;let pin=document.getElementById('pin'+id).value;let name=prompt('Nome dipendente',x.name)||x.name;await fetch('/api/employees/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,pin,team,active:x.active})});load()}async function toggle(id,active){let x=data.find(a=>a.id===id);await fetch('/api/employees/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:x.name,pin:x.pin,team:x.team,active})});load()}function edit(){}function exporter(){let u='/api/report?year='+y.value+'&month='+m.value;if(f.value)u+='&team='+f.value;if(e.value)u+='&employee_id='+e.value;location.href=u}load()</script></body></html>
