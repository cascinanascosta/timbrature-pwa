<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Area dipendente</title><style>:root{--cream:#f7f3dc;--purple:#55103f;--green:#62ad3e;--yellow:#f4c500;--pink:#f59d98}body{margin:0;background:var(--cream);color:var(--purple);font-family:Arial}.box{max-width:480px;margin:24px auto;padding:20px}.card{background:white;border:4px solid var(--purple);border-radius:20px;padding:22px;box-shadow:6px 6px 0 var(--purple)}h1{margin:0 0 8px}.badge{display:inline-block;background:var(--green);padding:7px 12px;border-radius:999px;font-weight:800}input,button{width:100%;padding:14px;margin:7px 0;border-radius:12px;border:3px solid var(--purple);font-size:16px}button{background:var(--yellow);font-weight:900;cursor:pointer}.punch{background:var(--green)}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:9px;border-bottom:2px solid #eadfca;text-align:left}.err{background:var(--pink);padding:10px;border-radius:10px;font-weight:800}</style></head><body><div class="box"><div class="card"><h1>Area dipendente</h1><p>Accedi con nome e PIN.</p><input id="name" placeholder="Nome dipendente"><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button onclick="login()">ACCEDI</button><div id="out"></div></div></div><script>let emp;async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,pin:pin.value})});if(!r.ok){out.innerHTML='<div class="err">Credenziali non valide</div>';return}emp=(await r.json()).employee;render()}async function render(){let a=await (await fetch('/api/my-punches?employee_id='+emp.id)).json();out.innerHTML='<h2>'+emp.name+'</h2><span class="badge">'+emp.team+'</span><p>Per timbrare apri il QR e scansiona il codice.</p><a href="/qr" style="display:block;text-align:center;background:var(--yellow);color:var(--purple);padding:14px;border-radius:12px;font-weight:900;text-decoration:none">APRI QR</a><h3>Ultime timbrature</h3><table><tr><th>Data</th><th>Ora</th><th>Tipo</th></tr>'+a.map(v=>'<tr><td>'+v.timestamp.slice(0,10)+'</td><td>'+new Date(v.timestamp).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+'</td><td>'+v.tipo+'</td></tr>').join('')+'</table>'}</script></body></html>
