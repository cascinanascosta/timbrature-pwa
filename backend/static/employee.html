<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dipendente</title><style>body{font-family:Arial;background:#f5f3ee;margin:0}.box{max-width:430px;margin:30px auto;padding:25px;background:#fff;border-radius:20px}input,button{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #ccc}button{background:#222;color:#fff;border:0}table{width:100%;margin-top:20px;border-collapse:collapse}td{padding:8px;border-bottom:1px solid #ddd}</style></head><body><div class="box"><h2>Area dipendente</h2><input id="name" placeholder="Nome"><input id="pin" type="password" placeholder="PIN"><button onclick="login()">Accedi</button><div id="out"></div></div><script>let emp;async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,pin:pin.value})});if(!r.ok){out.innerHTML='<b>Credenziali non valide</b>';return}let x=await r.json();emp=x.employee;let p=await fetch('/api/my-punches?employee_id='+emp.id);let a=await p.json();out.innerHTML='<h3>'+emp.name+' — '+emp.team+'</h3><table><tr><th>Data</th><th>Ora</th><th>Tipo</th></tr>'+a.map(v=>'<tr><td>'+v.timestamp.slice(0,10)+'</td><td>'+new Date(v.timestamp).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+'</td><td>'+v.tipo+'</td></tr>').join('')+'</table>'}</script></body></html>
