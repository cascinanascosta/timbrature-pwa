<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Timbratura</title><style>:root{--cream:#f7f3dc;--purple:#55103f;--yellow:#f4c500}body{margin:0;background:var(--cream);color:var(--purple);font-family:Arial;text-align:center}.box{max-width:520px;margin:25px auto;padding:20px}.card{background:white;border:4px solid var(--purple);border-radius:22px;padding:20px;box-shadow:6px 6px 0 var(--purple)}#qr{margin:20px auto;width:300px;height:300px;display:flex;align-items:center;justify-content:center;background:white}img{width:300px;height:300px}.timer{font-weight:900;background:var(--yellow);padding:10px;border-radius:12px;display:inline-block}</style></head><body><div class="box"><div class="card"><h1>QR TIMBRATURA</h1><div id="qr">Caricamento...</div><div class="timer" id="timer">5</div><p>Il codice cambia automaticamente ogni 5 secondi.</p></div></div><script>let n=5;async function draw(){let r=await fetch('/api/qr');let x=await r.json();n=5;let u=location.origin+'/employee?qr='+encodeURIComponent(x.token);qr.innerHTML='<img alt="QR timbratura" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(u)+'">'}draw();setInterval(()=>{n--;timer.textContent=Math.max(n,0)},1000);setInterval(draw,5000)</script></body></html>
