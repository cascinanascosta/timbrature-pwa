<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Timbratura</title><style>body{font-family:Arial;text-align:center;background:#f5f3ee;margin:0}.box{max-width:500px;margin:40px auto;padding:30px;background:#fff;border-radius:20px}#qr{margin:25px auto;width:300px;height:300px;display:flex;align-items:center;justify-content:center}</style></head><body><div class="box"><h1>CASCINA NASCOSTA</h1><h2>QR TIMBRATURA</h2><div id="qr"></div><p>Il codice cambia ogni 5 secondi.</p><p id="timer"></p></div><script>async function draw(){let r=await fetch('/api/qr');let x=await r.json();let u=location.origin+'/employee?qr='+encodeURIComponent(x.token);qr.innerHTML='<img width="300" height="300" alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(u)+'">'}draw();setInterval(draw,5000);</script></body></html>
