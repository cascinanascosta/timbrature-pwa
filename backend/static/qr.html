
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Timbratura — Cascina</title><link rel="stylesheet" href="/static/style.css">
<style>.qrbox{width:300px;height:300px;margin:20px auto;background:white;border-radius:18px;padding:20px;display:grid;place-items:center}.qrbox img{width:260px;height:260px}</style>
</head>
<body class="cream">
<div class="topbar"><a href="/" class="brand">CASCINA<br><span>NASCOSTA</span></a><div class="nav">QR TIMBRATURA</div></div>
<main class="container"><section class="card narrow center"><div class="eyebrow">CASCINA NASCOSTA</div><h2>Inquadra per accedere</h2><div class="qrbox"><img id="qr"></div><div id="token" class="muted"></div><p class="muted">Il codice cambia automaticamente ogni 5 secondi.</p></section></main>
<script>
async function refresh(){let r=await fetch('/api/qr-token');let d=await r.json();let target=location.origin+'/employee?token='+encodeURIComponent(d.token);document.querySelector('#qr').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(target);document.querySelector('#token').textContent='Codice temporaneo: '+d.token.slice(0,8)+'…';}
refresh();setInterval(refresh,5000);
</script>
</body></html>
