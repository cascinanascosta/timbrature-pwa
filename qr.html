<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>QR Timbrature</title>
<style>
body{margin:0;background:#111827;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;display:grid;place-items:center;min-height:100vh}
.wrap{width:min(92vw,680px)}
#qr{background:#fff;padding:18px;border-radius:18px;width:min(72vw,460px);height:auto;display:block;margin:0 auto}
h1{font-size:clamp(28px,5vw,44px);margin:0 0 18px}h2{font-size:clamp(20px,4vw,30px)}
#count{font-size:34px;font-weight:800}.sub{opacity:.8;margin-top:8px}.err{color:#fecaca;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<h1>CASCINA NASCOSTA</h1>
<img id="qr" alt="QR timbratura">
<h2>SCANSIONA PER TIMBRARE</h2>
<div>Codice valido per <span id="count">30</span> secondi</div>
<div id="status" class="sub">Connessione al server…</div>
</div>
<script>
const img=document.getElementById('qr'),count=document.getElementById('count'),status=document.getElementById('status');
let timer=null;
async function refresh(){
  try{
    status.className='sub'; status.textContent='Generazione QR…';
    const r=await fetch('/api/qr',{method:'POST',cache:'no-store'});
    if(!r.ok) throw new Error('Server non disponibile');
    const d=await r.json();
    if(!d.image) throw new Error('Immagine QR non generata');
    img.src=d.image;
    status.textContent='QR attivo';
    const end=Date.parse(d.expires_at);
    if(timer) clearInterval(timer);
    timer=setInterval(()=>{
      const s=Math.max(0,Math.ceil((end-Date.now())/1000));
      count.textContent=s;
      if(s<=0){clearInterval(timer);refresh();}
    },250);
  }catch(e){
    status.textContent='Errore: '+e.message; status.className='err';
    setTimeout(refresh,3000);
  }
}
refresh();
</script>
</body></html>
